name: Sync schema from spec

on:
  repository_dispatch:
    types: [spec_released]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Avoid a persisted Authorization header lingering in git config —
          # create-pull-request adds its own; two Authorization headers make the
          # push fail with remote: Duplicate header: "Authorization" (400).
          persist-credentials: false

      - name: Resolve version from dispatch payload
        id: vars
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::client_payload.version is empty — refusing to sync"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # opencoachingformat/spec has GitHub Pages disabled (has_pages: false), so a
      # Pages URL is not a reliable source. Fetch the schema straight from the repo
      # at the released ref via the Contents API instead — works regardless of
      # whether Pages is ever turned on, and fails loudly (404) if the tag/ref or
      # file path is wrong instead of silently writing an HTML 404 page as "schema".
      - name: Fetch schema from spec repo at released ref
        env:
          GH_TOKEN: ${{ secrets.SPEC_REPO_TOKEN || github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          gh api "repos/opencoachingformat/spec/contents/schema/v1.json?ref=$VERSION" \
            --jq '.content' | base64 -d > /tmp/new-schema.json

      - name: Sanity-check downloaded schema is valid JSON
        run: |
          python3 -c "import json; json.load(open('/tmp/new-schema.json'))" || {
            echo "::error::downloaded schema is not valid JSON — aborting sync"
            exit 1
          }

      # The spec repo's schema file stays named schema/v1.json on disk
      # regardless of its actual SemVer/x-ocf-version content (filename and
      # semantic version are independent). Determine the ACTUAL major from
      # the fetched content itself so a v2.0.0 release never gets vendored
      # into the v1 slot. Fails loudly (no PR opened) on a major this
      # workflow doesn't know how to route yet.
      - name: Determine fetched schema's actual major version
        id: fetched-major
        run: |
          MAJOR=$(python3 -c "
          import json
          d = json.load(open('/tmp/new-schema.json'))
          if 'x-ocf-version' not in d:
            print('MISSING')
          else:
            print('v' + d['x-ocf-version'].split('.')[0])
          ")
          if [ "$MAJOR" = "MISSING" ]; then
            echo "::error::fetched schema is missing x-ocf-version entirely — cannot determine its major, refusing to sync"
            exit 1
          fi
          if [ "$MAJOR" != "v1" ] && [ "$MAJOR" != "v2" ]; then
            echo "::error::fetched schema declares unsupported x-ocf-version major '$MAJOR' — this workflow only knows how to sync v1 and v2. Add support for $MAJOR before this can proceed automatically."
            exit 1
          fi
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Diff against vendored copy
        id: diff
        env:
          MAJOR: ${{ steps.fetched-major.outputs.major }}
        run: |
          TARGET="shared/schema/ocf-action-${MAJOR}.json"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -f "$TARGET" ] && diff -q /tmp/new-schema.json "$TARGET" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PROVENANCE.md holds ONE section per major (## ocf-action-vN.json), not
      # a growing log — each sync REPLACES that major's section in place, so
      # the file stays a fixed "current status per major" snapshot no matter
      # how many syncs have run. A naive `>>` append (an earlier version of
      # this step) would have left every sync's block piled on top of the
      # last, with a repeated "# Schema provenance" H1 and no way to tell
      # which block was current for a given major.
      - name: Update vendored schema + provenance
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          MAJOR: ${{ steps.fetched-major.outputs.major }}
          TARGET: ${{ steps.diff.outputs.target }}
        run: |
          cp /tmp/new-schema.json "$TARGET"
          python3 .github/scripts/update-provenance.py "$MAJOR" "$VERSION"

      # The committed browser bundle (packages/ts/dist/browser) embeds the
      # schema, and ci.yml enforces it is up to date (git diff --exit-code).
      # Rebuild it here so the auto-sync PR is green out of the box instead of
      # failing the bundle check and needing a manual rebuild.
      - name: Set up Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Rebuild the bundle AND bump the validator patch version. A pure schema
      # sync (schema bytes changed, validator code unchanged) is a patch release,
      # so we bump here and let the auto-tag-on-merge workflow publish it. If a
      # sync ever needs a validator *code* change (new error code, breaking
      # shape), CI surfaces that and a human cuts the non-patch release instead.
      - name: Rebuild browser bundle + bump validator patch version
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/ts
        run: |
          npm ci
          npm version patch --no-git-tag-version
          npm run build

      # No auto-merge: this only opens a PR for a human to review. Schema changes
      # can be additive (safe) or breaking (need a validator code change), and the
      # existing CI job (ci.yml) will run schema + conformance tests against the
      # updated file before anyone approves the merge.
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore: sync ${{ steps.fetched-major.outputs.major }} schema to ${{ steps.vars.outputs.version }} + bump validator patch"
          title: "chore: sync ${{ steps.fetched-major.outputs.major }} schema to ${{ steps.vars.outputs.version }} + bump validator patch"
          body: |
            Automated sync from `opencoachingformat/spec` @ `${{ steps.vars.outputs.version }}`,
            triggered by a `spec_released` repository_dispatch event.

            **This release's declared major version: `${{ steps.fetched-major.outputs.major }}`**
            (determined from the fetched schema's own `x-ocf-version` field, not from the
            spec repo's on-disk filename — the filename does not change across majors).

            Updated `${{ steps.diff.outputs.target }}` only. The OTHER supported major's
            vendored schema file is untouched by this PR.

            Rebuilds the browser bundle and **bumps the validator patch version** so
            merging this PR auto-publishes a new validator release (via the
            `auto-tag-on-sync-merge` workflow). CI must pass before merging — please
            review the schema diff (in particular any new `required` fields or removed
            enum values, which would need matching validator code changes and therefore
            a deliberate non-patch release) before approving. If this PR is for a major
            version this workflow has never synced before (a brand-new `ocf-action-vN.json`
            appearing for the first time), a validator code change to actually SUPPORT
            that major (new v*/ rule modules, dispatch wiring) is almost certainly needed
            before merging — the sync workflow only vendors the schema file, it cannot
            author new rule modules.
          branch: "auto/schema-sync-${{ steps.fetched-major.outputs.major }}-${{ steps.vars.outputs.version }}"
          delete-branch: true
