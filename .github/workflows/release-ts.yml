name: Release TS validator

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    name: Publish @opencoachingformat/validator to npm
    defaults:
      run:
        working-directory: packages/ts
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $VERSION does not match packages/ts/package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - name: Check browser bundle is committed and up to date
        run: git diff --exit-code -- dist/browser

      # Authenticates via OIDC trusted publishing (npm CLI >=11.5.1, bundled
      # with actions/setup-node@v6's Node 22) — no NPM_TOKEN needed. Requires
      # a trusted publisher already configured on the npm package pointing at
      # this repo + this workflow file, which in turn requires the package to
      # already exist (a one-time manual `npm publish` bootstraps it).
      # Provenance is automatic with trusted publishing, no --provenance flag.
      - name: Publish to npm
        run: npm publish
